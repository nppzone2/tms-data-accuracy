<title>TMS Data Accuracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: dải tiêu đề xanh đậm + tab; nội dung một cột tối đa 1200px: kết luận → 4 tiêu chí → theo dõi → bảng điểm → ưu tiên xử lý */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --sunk:#edf2ec; --ink:#10261a; --muted:#5a6b60; --line:#dce5da;
  --brand:#007a33; --brand-deep:#0c3a1d; --brand-lt:#e2f1e5; --leaf:#5aaa1e; --on-brand:#ffffff;
  --good:#18803c; --good-soft:#e1f2e6; --crit:#cf2f2b; --crit-soft:#fbe5e4; --warn:#a96500; --warn-soft:#fbefd8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --f-head:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(16,38,26,.06),0 6px 20px rgba(16,38,26,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b130f; --surface:#132019; --sunk:#0f1a14; --ink:#e6eee8; --muted:#97a99d; --line:#23342a;
  --brand:#3fae63; --brand-deep:#08200f; --brand-lt:#15301f; --leaf:#7cc14a; --on-brand:#ffffff;
  --good:#4cc27a; --good-soft:#12291b; --crit:#f07067; --crit-soft:#341a1a; --warn:#e2aa45; --warn-soft:#2e2412;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b130f; --surface:#132019; --sunk:#0f1a14; --ink:#e6eee8; --muted:#97a99d; --line:#23342a;
  --brand:#3fae63; --brand-deep:#08200f; --brand-lt:#15301f; --leaf:#7cc14a; --on-brand:#ffffff;
  --good:#4cc27a; --good-soft:#12291b; --crit:#f07067; --crit-soft:#341a1a; --warn:#e2aa45; --warn-soft:#2e2412;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);margin:0;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-head);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:1.05rem} h3{font-size:.95rem}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
code{font-size:.85em;background:var(--sunk);padding:1px 5px;border-radius:5px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
.sub{color:var(--muted);margin:2px 0 0;font-size:.86rem;max-width:72ch}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-head);font-weight:600;letter-spacing:-.02em}

/* ---------- đăng nhập ---------- */
#login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.lside{background:radial-gradient(120% 90% at 0% 100%,var(--leaf) 0%,transparent 55%),linear-gradient(160deg,var(--brand) 0%,var(--brand-deep) 75%);color:var(--on-brand);padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.lside .k{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:600}
.lside h1{font-size:clamp(2rem,4vw,3.1rem);line-height:1.08;margin-top:14px;font-weight:700}
.lside p{opacity:.85;max-width:38ch;margin:14px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills span{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:500}
.lmain{display:grid;place-items:center;padding:40px 20px}
.lcard{width:min(380px,100%);display:grid;gap:16px}
.lcard h2{font-size:1.4rem}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.82rem}
.field input,.field select{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field input:focus{border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);padding:12px}
.btn.sm{padding:6px 11px;font-size:.82rem}
.btn:disabled{opacity:.6;cursor:wait}
.lerr{color:var(--crit);font-weight:600;min-height:1.2em;margin:0;font-size:.88rem}
.note{font-size:.8rem;color:var(--muted);margin:0}
@media (max-width:820px){#login{grid-template-columns:1fr}.lside{padding:36px 24px}}

/* ---------- khung ứng dụng ---------- */
header.top{background:var(--brand-deep);color:var(--on-brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topin{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:14px 6px}
.brand{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--leaf),var(--brand));display:grid;place-items:center;font-family:var(--f-head);font-weight:700}
.brand h1{font-size:1.08rem}
.brand .meta{font-size:.78rem;opacity:.75}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools .btn,.tools select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--on-brand)}
.tools select{padding:6px 10px;border-radius:10px;border:1px solid}
.tools select option{color:#10261a}
.who{font-size:.78rem;opacity:.8}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 12px 12px;cursor:pointer;color:var(--on-brand);opacity:.7;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button:hover{opacity:1}
nav.tabs button.on{opacity:1;border-bottom-color:var(--leaf)}
main{padding-block:22px 48px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow)}
.ch{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:6px 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px;align-items:start}
footer{color:var(--muted);font-size:.78rem;padding-block:0 32px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .c b{font-family:var(--f-head);font-size:2.3rem;font-weight:700}
.ring .c small{display:block;color:var(--muted);font-size:.78rem;margin-top:4px}
.hero h2{font-size:1.45rem}
.verdict{font-family:var(--f-head);font-size:2rem;font-weight:700;line-height:1}
.npps{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-top:6px}
.npill{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);cursor:pointer;display:grid;gap:2px;text-align:left}
.npill:hover{border-color:var(--brand)}
.npill b{font-family:var(--f-head);font-weight:600;display:flex;gap:6px;align-items:center}
.npill span{font-size:.75rem;color:var(--muted)}
.npill.ok{border-left:4px solid var(--good)} .npill.no{border-left:4px solid var(--crit)}
@media (max-width:640px){.hero{grid-template-columns:1fr}.ring{width:112px;height:112px}}

/* ---------- chip / ô KPI ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.no{background:var(--crit-soft);color:var(--crit)}
.chip.na{background:var(--sunk);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;background:var(--surface);cursor:pointer;text-align:left;align-content:start}
.kpi:hover{border-color:var(--brand)}
.kpi .kh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kpi .kn{font-weight:600;font-size:.88rem}
.kpi .kv{font-family:var(--f-head);font-size:1.9rem;font-weight:600;line-height:1;letter-spacing:-.02em}
.kpi .kv small{font-size:.9rem;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .kt{font-size:.76rem;color:var(--muted)}
.kpi.trk .kv{font-size:1.45rem}
.meter{height:6px;background:var(--sunk);border-radius:3px;position:relative}
.meter b{display:block;height:100%;border-radius:3px}
.meter i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}

/* ---------- bảng ---------- */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:8px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
thead th{background:var(--sunk);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tbody th{font-weight:600}
tr.click{cursor:pointer} tr.click:hover td,tr.click:hover th{background:var(--brand-lt)}
td.cok{color:var(--good);font-weight:600} td.cno{color:var(--crit);font-weight:700;background:var(--crit-soft)}
tr.tot th,tr.tot td{background:var(--sunk);font-weight:600}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:.8rem}
.why{color:var(--muted);font-size:.78rem;max-width:44ch;min-width:28ch;white-space:normal}

/* ---------- ưu tiên ---------- */
.todo{display:grid;gap:8px;margin:0;padding:0;list-style:none;align-content:start}
.todo li{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--crit-soft)}
.todo li.okk{background:var(--good-soft)}
.todo .tn{font-family:var(--f-head);font-weight:700;font-size:1.25rem;text-align:center;line-height:1}
.todo .tn small{display:block;font-size:.62rem;font-weight:500;color:var(--muted);margin-top:3px}

/* ---------- tab con ---------- */
.segs{display:grid;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg .lbl{min-width:64px}
.seg button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.83rem;display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.seg button i{width:7px;height:7px;border-radius:50%}

/* ---------- biểu đồ ---------- */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;max-width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .tl{fill:var(--ink);font:600 12px var(--f-body)}
.chart .tv{fill:var(--ink);font:600 11px var(--f-body)}
.grid-l{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* ---------- bộ lọc ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters .field{min-width:0}
.filters input,.filters select{padding:8px 11px;border-radius:10px}
.filters input[type=search]{width:min(240px,100%)}
.check{display:inline-flex;gap:6px;align-items:center;padding-bottom:9px;font-size:.84rem}
.pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.84rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;z-index:9}

/* ---------- cách tính ---------- */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.rule{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;align-content:start}
.rule .rh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rule .rt{font-family:var(--f-head);font-weight:600;color:var(--brand);font-size:.85rem;text-align:right}
.rule p{margin:0;font-size:.88rem}
.rule.trk{background:var(--sunk)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.flow div{border-radius:12px;padding:14px;background:var(--brand-lt);display:grid;gap:4px}
.flow b{font-family:var(--f-head);font-size:1.1rem;color:var(--brand)}
@media (max-width:640px){.flow{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.stats div{border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:grid;gap:2px}
.stats b{font-family:var(--f-head);font-size:1.25rem;font-weight:600}
.stats span{font-size:.78rem;color:var(--muted)}
@media (max-width:640px){.card{padding:16px}.wrap{padding-inline:16px}}
@media (prefers-reduced-motion:no-preference){.kpi,.npill,.btn,tr.click td{transition:border-color .15s,background-color .15s}}
</style>

<div id="login">
  <section class="lside">
    <div><div class="k">Operation Excellence · DIP</div>
      <h1>TMS Data<br>Accuracy</h1>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const ENC = /*__ENC__*/;
/* Dữ liệu mã hoá AES-GCM, khoá dẫn xuất PBKDF2-SHA256 từ mật khẩu. Admin giải mã toàn bộ, mỗi NPP chỉ giải mã phần của mình. */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(user,pass){
  const u=String(user||'').trim().toLowerCase(), blob=ENC.blobs[u]||ENC.blobs[(ENC.alias||{})[u]];
  if(!blob) return null;
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(pass||'').trim()),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(blob.salt),iterations:ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.iv)},key,b64(blob.ct));
    const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(txt);
  }catch(e){return null;}
}
document.getElementById('lper').textContent='Kỳ '+ENC.period+' · cập nhật '+ENC.built;
document.getElementById('lform').addEventListener('submit',async e=>{e.preventDefault();
  const btn=e.target.querySelector('button[type=submit]'),err=document.getElementById('lerr'),u=document.getElementById('lu').value;
  btn.disabled=true;err.textContent='';btn.textContent='Đang mở dữ liệu…';
  const D=await unlock(u,document.getElementById('lp').value);
  btn.disabled=false;btn.textContent='Đăng nhập';document.getElementById('lp').value='';
  if(!D){err.textContent='Sai tên đăng nhập hoặc mật khẩu.';document.getElementById('lp').focus();return;}
  startApp(D,D.__role);
});
document.getElementById('lu').focus();
</script>
<script>
"use strict";
function startApp(DATA, LOGIN_ROLE){
const $=s=>document.querySelector(s);
const TH=DATA.thresholds, NPPS=DATA.npps;
const EK=DATA.err_keys;
const ERR=DATA.errors.map(r=>{const o={};EK.forEach((k,i)=>o[k]=r[i]);return o;});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v==null?'—':Number(v).toLocaleString('vi-VN');
const pc=(v,d=2)=>v==null?'—':Number(v).toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const n1=(v,d=1)=>v==null?'—':Number(v).toLocaleString('vi-VN',{maximumFractionDigits:d});
const SC=Object.fromEntries(DATA.scorecard.map(s=>[s.npp,s]));
const T_PLAN=Math.round(TH.plan_err_pct*100), T_TOL=Math.round(TH.npp_plan_tol*100);
const T_DT=TH.dt_month_pct*100, T_PL=TH.payload_tol*100;

let role=null, scope='ALL', page='overview', kpiSel='payload';
let EF={q:'',type:'',day:'',npp:'',pf:false}, epage=1;
const isAdmin=()=>role==='admin';
const curS=()=>scope==='ALL'?DATA.total:SC[scope];
const rowsIn=arr=>scope==='ALL'?arr:arr.filter(r=>(r.npp??r.TenantName)===scope);

/* ---------------- biểu đồ ---------------- */
function hbar(items,{thr=null,max=null,fmtv=v=>pc(v)}={}){
  const W=760,lw=64,rw=86,rh=28,H=items.length*rh+30;
  const raw=max??(Math.max(...items.map(i=>i.v||0),thr||0)*1.08||1);
  const mx=(()=>{const e=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,2.5,5,10]) if(m*e>=raw) return m*e;return 10*e;})();
  const x=v=>lw+(W-lw-rw)*(Math.max(0,v)/mx);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Biểu đồ theo NPP">`;
  [0,.5,1].forEach(t=>{const xx=lw+(W-lw-rw)*t;s+=`<line class="grid-l" x1="${xx}" x2="${xx}" y1="4" y2="${H-22}"/><text x="${xx}" y="${H-6}" text-anchor="middle">${n1(mx*t,mx<10?1:0)}</text>`;});
  items.forEach((it,i)=>{const y=6+i*rh;
    s+=`<text class="tl" x="${lw-10}" y="${y+15}" text-anchor="end">${esc(it.l)}</text>`;
    s+=`<rect x="${lw}" y="${y+5}" width="${Math.max(2,x(it.v)-lw)}" height="${rh-12}" rx="4" fill="${it.bad?'var(--crit)':'var(--good)'}"><title>${esc(it.l)}: ${fmtv(it.v)}</title></rect>`;
    s+=`<text class="tv" x="${x(it.v)+6}" y="${y+15}">${it.bad?'✕ ':''}${fmtv(it.v)}</text>`;});
  if(thr!=null){const tx=x(thr);s+=`<line x1="${tx}" x2="${tx}" y1="0" y2="${H-22}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>`;}
  return `<div class="chart">${s}</svg></div>`;
}
function vbar(items,{color='var(--brand)',hl=null,fmtv=fmt}={}){
  const W=560,H=210,pl=44,pb=32,pt=18;const mx=Math.max(...items.map(i=>i.v),1)*1.12;
  const bw=(W-pl-10)/items.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Biểu đồ cột">`;
  [0,.5,1].forEach(t=>{const y=H-pb-(H-pb-pt)*t;s+=`<line class="grid-l" x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(Math.round(mx*t))}</text>`;});
  items.forEach((it,i)=>{const h=(H-pb-pt)*(it.v/mx), x=pl+i*bw+bw*.18, y=H-pb-h;
    s+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(h,0)}" rx="3" fill="${hl&&hl(it)?'var(--crit)':color}"><title>${esc(it.l)}: ${fmtv(it.v)}</title></rect>`;
    if(items.length<=12) s+=`<text class="tv" x="${x+bw*.32}" y="${y-5}" text-anchor="middle">${fmtv(it.v)}</text>`;
    if(items.length<=12||i%2===0) s+=`<text x="${x+bw*.32}" y="${H-pb+16}" text-anchor="middle">${esc(it.l)}</text>`;});
  return `<div class="chart">${s}</svg></div>`;
}
function lines(days,series,{min=50,max=100}={}){
  const W=900,H=270,pl=44,pr=14,pt=14,pb=32;
  const x=i=>pl+(W-pl-pr)*(days.length<2?.5:i/(days.length-1));
  const y=v=>pt+(H-pt-pb)*(1-(Math.max(min,Math.min(max,v))-min)/(max-min));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Biểu đồ theo ngày">`;
  for(let v=min;v<=max;v+=10){s+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`;}
  days.forEach((d,i)=>{if(i%3===0||i===days.length-1) s+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${d}</text>`;});
  series.forEach(se=>{
    let d='';se.v.forEach((v,i)=>{if(v!=null) d+=(d?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);});
    s+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round"/>`;
    se.v.forEach((v,i)=>{if(v!=null) s+=`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="transparent"><title>${days[i]} · ${se.n}: ${pc(v)}</title></circle>`;});
  });
  return `<div class="chart">${s}</svg></div>`;
}
function ring(pass,total){
  const r=52,c=2*Math.PI*r,f=total?pass/total:0;
  return `<div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--crit-soft)" stroke-width="14"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--good)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*f} ${c}"/></svg><div class="c"><div><b>${pass}/${total}</b><small>NPP đạt</small></div></div></div>`;
}

function tile(c,s,all,track){
  const ok=c.ok(s)==='PASS';
  let bar='';
  if(c.bar){const [v,t]=c.bar(s);bar=`<div class="meter" aria-hidden="true"><b style="width:${Math.min(100,(v||0)/(t*3)*100)}%;background:${ok?'var(--good)':'var(--crit)'}"></b><i style="left:33.3%"></i></div>`;}
  const npass=all?DATA.scorecard.filter(x=>c.ok(x)==='PASS').length:null;
  return `<button type="button" class="kpi ${track?'trk':''}" data-kpi="${c.k}">
    <div class="kh"><span class="kn">${c.n}</span>${track?trkChip(c.ok(s)):chip(c.ok(s))}</div>
    <div class="kv">${c.v(s)}</div>${bar}
    <div class="kt">${esc(c.sub(s))}</div>
    <div class="kt">${esc(c.th)}${all?` · ${npass}/${NPPS.length} NPP ${track?'trong mức':'đạt'}`:''}</div></button>`;
}
function gaps(s){
  const g=[], m=s.margin;
  if(s.v_payload==='FAIL') g.push([-m.pl_margin,'chuyến',`Payload: giảm ${fmt(-m.pl_margin)} chuyến quá tải (tối đa ${fmt(m.pl_allow)} chuyến).`]);
  if(s.v_dt==='FAIL') g.push([-m.dt_margin,'chuyến',`Distance & Time: giảm ${fmt(-m.dt_margin)} chuyến lỗi (tối đa ${fmt(m.dt_allow)} chuyến).`]);
  if(s.v_created==='FAIL') g.push([s.cd_routes_fail,'chuyến',`Created Date: rà ${fmt(s.cd_fail)} đơn tạo sau khi giao. Không cho phép chuyến nào.`]);
  if(s.v_username==='FAIL') g.push([s.users_wrong,'tài khoản',`User name: đổi sang SĐT, biển số xe hoặc tài khoản DSA.`]);
  return g.sort((a,b)=>a[0]-b[0]);
}
function todoList(s){
  const g=gaps(s), m=s.margin;
  if(!g.length) return `<ul class="todo"><li class="okk"><span class="tn">✓</span><span>Đạt cả 4 tiêu chí. Dư địa: ${fmt(m.dt_margin)} chuyến lỗi D&T, ${fmt(m.pl_margin)} chuyến quá tải.</span></li></ul>`;
  return `<ul class="todo">${g.map(x=>`<li><span class="tn">${fmt(x[0])}<small>${x[1]}</small></span><span>${esc(x[2])}</span></li>`).join('')}</ul>`;
}

/* ---------------- Chi tiết KPI ---------------- */
function head(c,s,track){
  return `<div class="ch"><div><div class="lbl">${scope==='ALL'?'Tất cả NPP':'NPP '+esc(scope)} · ${track?'theo dõi':'xét kết quả'}</div><h2>${c.n}: ${c.v(s).replace(/<small>/,' <small>')}</h2><p class="sub">${esc(c.sub(s))} · ${esc(c.th)}</p></div>${track?trkChip(c.ok(s)):chip(c.ok(s))}</div>`;
}
const byNpp=(f,o={})=>hbar(DATA.scorecard.map(x=>({l:x.npp,v:f(x),bad:o.bad?o.bad(x):false})),o);
const capMax=(f,t)=>Math.max(t*1.5,...DATA.scorecard.map(f))*1.08;
function sec(title,sub,body){return `<section class="card"><div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div>${body}</section>`;}
function pKpi(){
  const s=curS(), all=scope==='ALL';
  if(!DA.concat(TRK).some(c=>c.k===kpiSel)) kpiSel='payload';
  const btn=(c,track)=>`<button type="button" data-ks="${c.k}" class="${c.k===kpiSel?'on':''}" aria-pressed="${c.k===kpiSel}">${track?'':`<i style="background:${c.ok(s)==='PASS'?'var(--good)':'var(--crit)'}"></i>`}${c.n}</button>`;
  let h=`<div class="segs"><div class="seg"><span class="lbl">Xét KQ</span>${DA.map(c=>btn(c,false)).join('')}</div><div class="seg"><span class="lbl">Theo dõi</span>${TRK.map(c=>btn(c,true)).join('')}</div></div>`;
  const k=kpiSel, da=DA.find(c=>c.k===k), c=da||TRK.find(x=>x.k===k), track=!da;
  const top=extra=>`<section class="card">${head(c,s,track)}${extra||''}</section>`;
  const plRow=r=>`<tr class="click" data-plan="${esc(r.plan)}"><td class="mono">${esc(r.plan)}</td><td>${esc(r.npp)}</td><td>${esc(r.date)}</td>`;
  if(k==='payload'){
    h+=top(all?byNpp(x=>x.payload_fail_pct,{thr:T_PL,max:capMax(x=>x.payload_fail_pct,T_PL),bad:x=>x.v_payload==='FAIL'}):'');
    h+=sec(`Chuyến chở ≥ ${TH.payload_ratio} lần tải trọng`,'Vẫn ghi lỗi để theo dõi dù NPP đạt. Nên kiểm tra tải trọng xe khai trên TMS.',
      table([['Chuyến'],['NPP'],['Ngày'],['Xe'],['Đơn','n'],['Hàng','n'],['Tải trọng','n'],['Tỷ lệ','n']],rowsIn(DATA.pl_top).map(r=>plRow(r)+`<td class="mono">${esc(r.truck)}</td><td class="n">${fmt(r.orders)}</td><td class="n">${n1(r.weight,2)} t</td><td class="n">${n1(r.cap,2)} t</td><td class="n cno">${n1(r.ratio,2)}×</td></tr>`)));
  }
  if(k==='dt'){
    h+=top(all?byNpp(x=>x.dt_route_fail_pct,{thr:T_DT,max:capMax(x=>x.dt_route_fail_pct,T_DT),bad:x=>x.v_dt==='FAIL'}):'');
    h+=sec('Chuyến lỗi Distance & Time',`Đơn lỗi: cách outlet trước < ${TH.dt_gap_min} phút và > ${TH.dt_dist_min}m. Chuyến lỗi khi > ${TH.dt_route_pct*100}% đơn lỗi.`,
      table([['Chuyến'],['NPP'],['Ngày'],['Tài khoản'],['Đơn','n'],['Đơn lỗi','n'],['Tỷ lệ','n']],rowsIn(DATA.dt_top).map(r=>plRow(r)+`<td class="mono">${esc(r.user)}</td><td class="n">${fmt(r.orders)}</td><td class="n">${fmt(r.bad)}</td><td class="n cno">${pc(r.bad/r.orders*100,0)}</td></tr>`)));
  }
  if(k==='created'){
    h+=top(all?byNpp(x=>x.cd_routes_fail,{fmtv:v=>fmt(v)+' chuyến',max:Math.max(1,...DATA.scorecard.map(x=>x.cd_routes_fail))*1.25,bad:x=>x.cd_routes_fail>0}):'');
    h+=sec('Đơn tạo sau khi giao','Created Date lấy từ <code>Sent_To_distributor</code> (Fill Rate), ghép <code>DocNo = OrderNumber</code>. 1 đơn lỗi là chuyến lỗi.',
      table([['Đơn'],['Chuyến'],['NPP'],['Tài khoản'],['Tạo lúc'],['Giao lúc'],['Chênh','n']],rowsIn(DATA.cd_list).map(r=>`<tr class="click" data-plan="${esc(r.plan)}"><td class="mono">${esc(r.order)}</td><td class="mono">${esc(r.plan)}</td><td>${esc(r.npp)}</td><td class="mono">${esc(r.user)}</td><td class="mono">${esc(r.created)}</td><td class="mono">${esc(r.delivered)}</td><td class="n cno">${r.hours>=24?n1(r.hours/24)+' ngày':n1(r.hours)+' giờ'}</td></tr>`)));
  }
  if(k==='username'){
    h+=top();
    h+=sec('Tài khoản giao hàng','Hợp lệ: SĐT 10 số, biển số xe, hoặc tài khoản DSA.',
      table([['NPP'],['Tài khoản','n'],['Đơn DSA','n'],['Đơn SĐT','n'],['Đơn biển số','n'],['Sai','n'],['Danh sách sai']],(all?DATA.scorecard:[s]).map(x=>`<tr><th scope="row">${x.npp}</th><td class="n">${fmt(x.users_total)}</td>${['DSA','SĐT tài xế','Biển số xe'].map(t=>`<td class="n">${fmt(x.user_types[t]||0)}</td>`).join('')}<td class="n ${x.users_wrong?'cno':''}">${fmt(x.users_wrong)}</td><td class="mono">${esc(x.users_wrong_list.join(', '))||'—'}</td></tr>`)));
  }
  if(k==='geo'){
    h+=top(all?byNpp(x=>x.geo_pct,{thr:TH.geo,max:100,bad:x=>x.v_geo==='FAIL'}):'');
    h+=sec('Đơn lỗi Geo theo điều kiện','Một đơn có thể trượt nhiều điều kiện. Không tính đơn tài khoản DSA.',
      table([['NPP'],['Đơn xét','n'],['Đơn lỗi','n'],[`Lệch > ${TH.geo_radius_m}m`,'n'],[`≤ ${TH.geo_gap_min} phút`,'n'],['Ngoài giờ','n'],['Tỷ lệ đạt','n']],(all?DATA.scorecard:[s]).map(x=>`<tr><th scope="row">${x.npp}</th><td class="n">${fmt(x.geo_scope)}</td><td class="n">${fmt(x.geo_fail)}</td><td class="n">${fmt(x.geo_v)}</td><td class="n">${fmt(x.geo_w)}</td><td class="n">${fmt(x.geo_x)}</td><td class="n">${pc(x.geo_pct)}</td></tr>`)));
    const gd=DATA.geo_dist[scope], hr=DATA.hours[scope];
    h+=`<div class="grid2">${sec('Khoảng lệch vị trí','Chỉ nhóm 0–50m đạt.',vbar(gd.map(g=>({l:g.label,v:g.n})),{hl:it=>it.l!=='0–50m'}))}
      ${sec('Giờ hoàn tất',`Cột đỏ: ngoài ${String(TH.work_start).padStart(2,'0')}:00–${TH.work_end}:00.`,vbar(hr.map((v,i)=>({l:i+'h',v})),{hl:it=>{const hh=parseInt(it.l);return hh<TH.work_start||hh>=TH.work_end;}}))}</div>`;
  }
  if(k==='ontime'){
    h+=top(all?byNpp(x=>x.ot_pct,{thr:TH.ontime,max:100,bad:x=>x.v_ontime==='FAIL'}):'');
    const late={};ERR.filter(e=>(scope==='ALL'||e.TenantName===scope)&&e.loi.split(' + ').includes('On time')).forEach(e=>{const m=/trễ hạn (\d+) ngày/.exec(e.ly_do);const key=m?m[1]+' ngày':(/chưa có giờ giao/.test(e.ly_do)?'Thiếu giờ giao':'Trong ngày hứa');late[key]=(late[key]||0)+1;});

const XCOLS=[['Date','Ngày'],['TenantName','NPP'],['PlanNumber','Chuyến'],['OrderNumber','Đơn'],['OutletCode','Outlet'],['username','Tài khoản'],['utype','Loại tài khoản'],['DriverName','Tài xế/Xe'],['Status','Trạng thái'],['Sent_To_distributor','Created Date'],['DeliverDateTime','Giao lúc'],['PromisedDate','Ngày hứa'],['distance_to_dropped','Lệch vị trí (m)'],['gap','Cách outlet trước (phút)'],['seq','Thứ tự trong chuyến'],['plan_orders','Số đơn của chuyến'],['plan_err','Đơn lỗi của chuyến'],['plan_err_pct','% đơn lỗi của chuyến'],['plan_fail_txt','Chuyến lỗi >30%'],['plan_ratio','Tỷ lệ tải chuyến'],['TruckCategory','Loại xe'],['TruckCapacityWeight','Tải trọng xe'],['Assigned_Weight','Khối lượng đơn'],['h24_dur','Thời gian SLA 24H (giờ)'],['loi','Loại lỗi'],['ly_do','Chi tiết']];
const xv=(r,k)=>k==='plan_err_pct'?Math.round(r.plan_err_ratio*1000)/10:k==='plan_fail_txt'?(r.plan_fail?'Có':'Không'):r[k];
async function saveFile(kind){
  const rows=filtered();
  const name=`TMS_don_loi_${scope==='ALL'?(EF.npp||'tat_ca'):scope}${EF.type?'_'+EF.type.replace(/\W+/g,''):''}${EF.day?'_'+EF.day.replace('/','-'):''}.${kind}`;
  let data;
  if(kind==='csv'){
    const q=v=>{const s=String(v??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
    data='﻿'+[XCOLS.map(c=>c[1]).join(','),...rows.map(r=>XCOLS.map(c=>q(xv(r,c[0]))).join(','))].join('\n');
  } else {
    if(!window.XLSX){toast('Chưa tải được thư viện Excel, hãy dùng CSV.');return;}
    const ws=XLSX.utils.aoa_to_sheet([XCOLS.map(c=>c[1]),...rows.map(r=>XCOLS.map(c=>xv(r,c[0])??''))]);
    ws['!cols']=XCOLS.map(c=>({wch:Math.max(10,c[1].length+2)}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Don loi');
    data=new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'}));
  }
  const dl=window.claude&&window.claude.use&&await window.claude.use('downloads');
  if(!dl){const blob=new Blob([data],{type:kind==='csv'?'text/csv;charset=utf-8':'application/octet-stream'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast('Đã tải '+fmt(rows.length)+' dòng');return;}
  try{await dl.save({filename:name,data});toast('Đã tải '+fmt(rows.length)+' dòng');}
  catch(e){if(e&&e.code!=='declined') toast('Không tải được file ('+(e.code||'lỗi')+').');}
}

function render(){

function go(p){page=p;render();window.scrollTo({top:0});}
function setScope(n){if(!isAdmin())return;scope=n;$('#scope').value=n;EF.npp='';epage=1;render();}
const reset=o=>Object.assign({q:'',type:'',day:'',npp:'',pf:false},o);
function wire(){
  document.querySelectorAll('[data-npp]').forEach(el=>el.addEventListener('click',()=>setScope(el.dataset.npp)));
  document.querySelectorAll('.kpi[data-kpi]').forEach(el=>el.addEventListener('click',()=>{kpiSel=el.dataset.kpi;go('kpi');}));
  document.querySelectorAll('[data-ks]').forEach(el=>el.addEventListener('click',()=>{kpiSel=el.dataset.ks;render();}));
  document.querySelectorAll('[data-plan]').forEach(el=>el.addEventListener('click',()=>{EF=reset({q:el.dataset.plan});epage=1;go('errors');}));
  document.querySelectorAll('[data-user]').forEach(el=>el.addEventListener('click',()=>{EF=reset({q:el.dataset.user});epage=1;go('errors');}));
  document.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click',()=>{EF=reset({day:el.dataset.day});epage=1;go('errors');}));
  if(page==='errors'){
    let tmr;
    $('#fq').addEventListener('input',e=>{clearTimeout(tmr);tmr=setTimeout(()=>{EF.q=e.target.value;epage=1;render();const f=$('#fq');f.focus();f.setSelectionRange(f.value.length,f.value.length);},300);});
    $('#ft').addEventListener('change',e=>{EF.type=e.target.value;epage=1;render();});
    $('#fd').addEventListener('change',e=>{EF.day=e.target.value;epage=1;render();});
    $('#fpf').addEventListener('change',e=>{EF.pf=e.target.checked;epage=1;render();});
    if($('#fn')) $('#fn').addEventListener('change',e=>{EF.npp=e.target.value;epage=1;render();});
    $('#fclear').addEventListener('click',()=>{EF=reset({});epage=1;render();});
    $('#pprev').addEventListener('click',()=>{epage--;render();});
    $('#pnext').addEventListener('click',()=>{epage++;render();});
    $('#xlsx').addEventListener('click',()=>saveFile('xlsx'));
    $('#csv').addEventListener('click',()=>saveFile('csv'));
  }
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b) go(b.dataset.p);});
$('#scope').addEventListener('change',e=>setScope(e.target.value));
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600);}
$('#theme').addEventListener('click',()=>{const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme!=='dark':!matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'dark':'light';$('#theme').setAttribute('aria-pressed',dark);});

/* ---------------- vào ứng dụng ---------------- */
$('#foot').textContent=`Nguồn: ${DATA.meta.src} · Kỳ ${DATA.meta.period} · Cập nhật ${DATA.meta.built}`;
role=LOGIN_ROLE;scope=role==='admin'?'ALL':role;
$('#who').textContent=role==='admin'?'Admin':'NPP '+role;
const sel=$('#scope');sel.hidden=role!=='admin';
if(role==='admin') sel.innerHTML=`<option value="ALL">Tất cả NPP</option>`+NPPS.map(n=>`<option value="${n}">NPP ${n}</option>`).join('');
$('#login').hidden=true;$('#app').hidden=false;
const want=(location.hash||'').slice(1);
page=PAGES.some(p=>p[0]===want)&&(want!=='dq'||role==='admin')?want:'overview';
render();
$('#logout').addEventListener('click',()=>{try{history.replaceState(null,'',location.pathname);}catch(_){}location.reload();});
}
</script>
