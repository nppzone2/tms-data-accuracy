<title>TMS Data Accuracy HCM Zone 2–3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: bảng điều khiển vận hành — thanh tiêu đề + tab, tóm tắt kết luận trước, chi tiết sau; một cột rộng tối đa 1240px */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --sunk:#e9ede8; --ink:#16201b; --muted:#56645c; --line:#d6ddd7;
  --accent:#23466a; --accent-soft:#e2e9f1;
  --good:#1f7f48; --good-soft:#e1f1e7; --warn:#a56a00; --warn-soft:#f8ecd2; --crit:#c0392f; --crit-soft:#f8e1de;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#171e1b; --sunk:#121816; --ink:#e4ebe6; --muted:#97a69d; --line:#2a3530;
  --accent:#93b6dc; --accent-soft:#1d2a38;
  --good:#52c27f; --good-soft:#15291e; --warn:#e2aa45; --warn-soft:#2e2412; --crit:#f07067; --crit-soft:#33191a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#171e1b; --sunk:#121816; --ink:#e4ebe6; --muted:#97a69d; --line:#2a3530;
  --accent:#93b6dc; --accent-soft:#1d2a38;
  --good:#52c27f; --good-soft:#15291e; --warn:#e2aa45; --warn-soft:#2e2412; --crit:#f07067; --crit-soft:#33191a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
.num,.mono,td.n,th.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.cap{color:var(--muted);margin:4px 0 0;max-width:75ch}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* ---------- đăng nhập ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:48px 16px}
.lcard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:16px}
.lcard h1{font-size:1.6rem}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.85rem}
.field input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.lerr{color:var(--crit);font-weight:600;min-height:1.2em;margin:0}
.lnote{font-size:.82rem;color:var(--muted);margin:0}

/* ---------- khung ---------- */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topin{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:12px}
.brand{display:grid;gap:0;min-width:0;flex:1 1 280px}
.brand h1{font-size:1.25rem}
.brand .meta{color:var(--muted);font-size:.82rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.who{font-size:.82rem;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 48px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
footer{color:var(--muted);font-size:.8rem;padding-block:0 32px}

/* ---------- kết luận ---------- */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.vbig{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1}
.vbig small{font-size:1rem;color:var(--muted);font-weight:600}
.vtext{display:grid;gap:4px;min-width:0}
.pass{color:var(--good)} .fail{color:var(--crit)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.no{background:var(--crit-soft);color:var(--crit)}
.chip.na{background:var(--sunk);color:var(--muted)}
.chip.new{background:var(--accent-soft);color:var(--accent)}
.npps{display:flex;flex-wrap:wrap;gap:6px}
.npill{border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--bg);cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-weight:600}
.npill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.npill:hover{border-color:var(--accent)}

/* ---------- ô tiêu chí ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;background:var(--surface);cursor:pointer;text-align:left;border-top:3px solid var(--line)}
.kpi.ok{border-top-color:var(--good)} .kpi.no{border-top-color:var(--crit)}
.kpi:hover{border-color:var(--accent)}
.kpi .kh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kpi .kn{font-weight:700;font-size:.9rem}
.kpi .kv{font-family:var(--f-mono);font-size:1.55rem;font-weight:600;line-height:1.1}
.kpi .kt{font-size:.78rem;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;position:relative;overflow:visible}
.bar b{display:block;height:100%;border-radius:3px}
.bar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* ---------- bảng ---------- */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{background:var(--sunk);font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:sticky;top:0;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
td.cok{color:var(--good);font-weight:600} td.cno{color:var(--crit);font-weight:700;background:var(--crit-soft)}
.matrix td.n{min-width:84px}

/* ---------- việc cần làm ---------- */
.todo{display:grid;gap:8px;align-content:start;margin:0;padding:0;list-style:none}
.todo li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--crit-soft)}
.todo li.okk{background:var(--good-soft)}
.todo .tn{font-family:var(--f-mono);font-weight:700;font-size:1.1rem;min-width:3.5ch;text-align:right}

/* ---------- tab con ---------- */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.seg button i{width:7px;height:7px;border-radius:50%}

/* ---------- biểu đồ ---------- */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;max-width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .lbl{fill:var(--ink);font:600 12px var(--f-body)}
.chart .val{fill:var(--ink);font:600 11px var(--f-mono)}
.grid-l{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:4px;border-radius:2px;display:inline-block}

/* ---------- bộ lọc ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.filters .field{min-width:0}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.filters input[type=search]{width:min(260px,100%)}
.pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.why{color:var(--muted);font-size:.8rem;max-width:46ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:9}

/* ---------- cách chấm ---------- */
.gate{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.gate div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:600;background:var(--bg);display:grid;gap:2px}
.gate div span{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-weight:400}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.rule{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.rule .rh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rule .rt{font-family:var(--f-mono);font-weight:600;color:var(--accent)}
.rule p{margin:0}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 8px 8px 0}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.dl div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.dl b{font-family:var(--f-mono);font-size:1.25rem}
.dl span{font-size:.8rem;color:var(--muted)}
@media (max-width:640px){.vbig{font-size:2rem}.verdict{grid-template-columns:1fr}.card{padding:14px}}
@media (prefers-reduced-motion:no-preference){.kpi,.npill,.btn{transition:border-color .15s}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const ENC = /*__ENC__*/;
/* Dữ liệu được mã hoá AES-GCM, khoá dẫn xuất PBKDF2-SHA256 từ mật khẩu. Mỗi tài khoản có gói dữ liệu riêng:
   admin giải mã được toàn bộ, mỗi NPP chỉ giải mã được dữ liệu của mình. Sai mật khẩu thì không giải mã được. */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(user,pass){
  const u=String(user||'').trim().toLowerCase(), blob=ENC.blobs[u]||ENC.blobs[(ENC.alias||{})[u]];
  if(!blob) return null;
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(pass||'').trim()),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(blob.salt),iterations:ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.iv)},key,b64(blob.ct));
    const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(txt);
  }catch(e){return null;}
}
document.getElementById('lper').textContent='Kỳ '+ENC.period+' · cập nhật '+ENC.built;
document.getElementById('lform').addEventListener('submit',async e=>{e.preventDefault();
  const btn=e.target.querySelector('button[type=submit]'),err=document.getElementById('lerr'),u=document.getElementById('lu').value;
  btn.disabled=true;err.textContent='Đang mở dữ liệu…';
  const D=await unlock(u,document.getElementById('lp').value);
  btn.disabled=false;document.getElementById('lp').value='';
  if(!D){err.textContent='Tên đăng nhập hoặc mật khẩu không đúng.';document.getElementById('lp').focus();return;}
  err.textContent='';startApp(D,D.__role);
});
document.getElementById('lu').focus();
</script>
<script>
"use strict";
function startApp(DATA, LOGIN_ROLE){
const $=s=>document.querySelector(s);
const TH=DATA.thresholds, NPPS=DATA.npps;
const EK=DATA.err_keys;
const ERR=DATA.errors.map(r=>{const o={};EK.forEach((k,i)=>o[k]=r[i]);return o;});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v==null?'—':Number(v).toLocaleString('vi-VN');
const pc=(v,d=2)=>v==null?'—':Number(v).toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const n1=(v,d=1)=>v==null?'—':Number(v).toLocaleString('vi-VN',{maximumFractionDigits:d});
const SC=Object.fromEntries(DATA.scorecard.map(s=>[s.npp,s]));

/* 7 tiêu chí — thứ tự hiển thị, ngưỡng, cách đọc giá trị */
const CR=[
 {k:'username',n:'User name',v:s=>s.username_pct,u:'%',th:'100%',ok:s=>s.v_username,sub:s=>fmt(s.username_fail)+' đơn tài khoản không hợp lệ',thr:100},
 {k:'geo',n:'Geo Compliance',v:s=>s.geo_pct,u:'%',th:'≥ '+TH.geo+'%',ok:s=>s.v_geo,sub:s=>fmt(s.geo_fail)+' / '+fmt(s.geo_scope)+' đơn lỗi (không tính DSA)',thr:TH.geo},
 {k:'ontime',n:'On time',v:s=>s.ot_pct,u:'%',th:'> '+TH.ontime+'%',ok:s=>s.v_ontime,sub:s=>fmt(s.ot_fail)+' đơn trễ hạn',thr:TH.ontime},
 {k:'successful',n:'Successful',v:s=>s.succ_pct,u:'%',th:'> '+TH.successful+'%',ok:s=>s.v_successful,sub:()=>'Dùng chung kết quả On time',thr:TH.successful},
 {k:'dt',n:'Distance & Time',v:s=>s.dt_route_fail_pct,u:'% chuyến',th:'< '+(TH.dt_month_pct*100)+'% chuyến',ok:s=>s.v_dt,sub:s=>fmt(s.dt_routes_fail)+' / '+fmt(s.plans)+' chuyến hỏng',thr:TH.dt_month_pct*100,low:true},
 {k:'payload',n:'Payload',v:s=>s.payload_plans_fail,u:' chuyến',th:'0 chuyến quá tải',ok:s=>s.v_payload,sub:s=>'Tỷ lệ tải cao nhất '+n1(s.payload_max_ratio,2)+' lần',cnt:true},
 {k:'created',n:'Created Date',v:s=>s.cd_pct,u:'%',th:'100% (đề xuất)',ok:s=>s.v_created,sub:s=>fmt(s.cd_fail)+' đơn tạo sau khi giao',thr:100,isNew:true}
];
const crOf=k=>CR.find(c=>c.k===k);
const valTxt=(c,s)=>c.cnt?fmt(c.v(s)):pc(c.v(s));

let role=null, scope='ALL', page='overview', kpiSel='payload';
let EF={q:'',type:'',day:'',npp:'',pf:false}, epage=1;
const isAdmin=()=>role==='admin';
const curS=()=>scope==='ALL'?DATA.total:SC[scope];
const rowsIn=arr=>scope==='ALL'?arr:arr.filter(r=>(r.npp??r.TenantName)===scope);

/* ---------------- biểu đồ SVG ---------------- */
function hbar(items,{thr=null,max=null,unit='%',low=false,fmtv=v=>pc(v),onclick=''}={}){
  const W=760,lw=74,rw=70,rh=26,H=items.length*rh+30;
  const mx=max??(Math.max(...items.map(i=>i.v||0),thr||0)*1.05||1);
  const x=v=>lw+(W-lw-rw)*(Math.max(0,v)/mx);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Biểu đồ thanh">`;
  [0,.25,.5,.75,1].forEach(t=>{const xx=lw+(W-lw-rw)*t;s+=`<line class="grid-l" x1="${xx}" x2="${xx}" y1="4" y2="${H-22}"/><text x="${xx}" y="${H-6}" text-anchor="middle">${n1(mx*t,mx<10?1:0)}</text>`;});
  items.forEach((it,i)=>{const y=6+i*rh;const bad=it.bad;
    s+=`<g ${onclick?`style="cursor:pointer" data-npp="${esc(it.l)}"`:''}><text class="lbl" x="${lw-8}" y="${y+14}" text-anchor="end">${esc(it.l)}</text>`;
    s+=`<rect x="${lw}" y="${y+3}" width="${Math.max(1,x(it.v)-lw)}" height="${rh-10}" rx="3" fill="${bad?'var(--crit)':'var(--good)'}" opacity="${bad?.9:.75}"/>`;
    s+=`<text class="val" x="${x(it.v)+6}" y="${y+14}">${fmtv(it.v)}</text></g>`;});
  if(thr!=null){const tx=x(thr);s+=`<line x1="${tx}" x2="${tx}" y1="0" y2="${H-22}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>`;}
  return `<div class="chart">${s}</svg></div>`;
}
function vbar(items,{color='var(--accent)',hl=null,fmtv=fmt}={}){
  const W=560,H=220,pl=44,pb=34,pt=16;const mx=Math.max(...items.map(i=>i.v),1)*1.1;
  const bw=(W-pl-10)/items.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Biểu đồ cột">`;
  [0,.5,1].forEach(t=>{const y=H-pb-(H-pb-pt)*t;s+=`<line class="grid-l" x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(Math.round(mx*t))}</text>`;});
  items.forEach((it,i)=>{const h=(H-pb-pt)*(it.v/mx), x=pl+i*bw+bw*.15, y=H-pb-h;
    const c=hl&&hl(it)?'var(--crit)':color;
    s+=`<rect x="${x}" y="${y}" width="${bw*.7}" height="${Math.max(h,0)}" rx="2" fill="${c}"><title>${esc(it.l)}: ${fmtv(it.v)}</title></rect>`;
    if(items.length<=12) s+=`<text class="val" x="${x+bw*.35}" y="${y-4}" text-anchor="middle">${fmtv(it.v)}</text>`;
    if(items.length<=12||i%2===0) s+=`<text x="${x+bw*.35}" y="${H-pb+16}" text-anchor="middle">${esc(it.l)}</text>`;});
  return `<div class="chart">${s}</svg></div>`;
}
function lines(days,series,{min=60,max=100}={}){
  const W=900,H=280,pl=44,pr=14,pt=14,pb=34;
  const x=i=>pl+(W-pl-pr)*(days.length<2?.5:i/(days.length-1));
  const y=v=>pt+(H-pt-pb)*(1-(Math.max(min,Math.min(max,v))-min)/(max-min));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Biểu đồ đường theo ngày">`;
  for(let v=min;v<=max;v+=10){s+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`;}
  days.forEach((d,i)=>{if(i%3===0||i===days.length-1) s+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${d}</text>`;});
  series.forEach(se=>{
    if(se.thr!=null) s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(se.thr)}" y2="${y(se.thr)}" stroke="${se.c}" stroke-dasharray="5 4" opacity=".7"/>`;
    const pts=se.v.map((v,i)=>v==null?null:[x(i),y(v)]);
    let d='';pts.forEach(p=>{if(p) d+=(d?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);});
    s+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="2"/>`;
    pts.forEach((p,i)=>{if(p) s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${se.thr!=null&&se.v[i]<se.thr?3.5:2}" fill="${se.thr!=null&&se.v[i]<se.thr?'var(--crit)':se.c}"><title>${days[i]} · ${se.n}: ${pc(se.v[i])}</title></circle>`;});
  });
  return `<div class="chart">${s}</svg></div>`;
}

/* ---------------- bảng ---------------- */
function table(head,rows,{cls='',click=null}={}){
  return `<div class="tscroll"><table class="${cls}"><thead><tr>${head.map(h=>`<th class="${h[1]||''}" scope="col">${h[0]}</th>`).join('')}</tr></thead><tbody>${
    rows.length?rows.join(''):`<tr><td colspan="${head.length}" style="color:var(--muted)">Không có dòng nào.</td></tr>`}</tbody></table></div>`;
}
const chip=v=>v==='PASS'?'<span class="chip ok">✓ ĐẠT</span>':v==='FAIL'?'<span class="chip no">✕ KHÔNG ĐẠT</span>':'<span class="chip na">Chưa chấm</span>';

const T_PLAN=Math.round(TH.plan_err_pct*100), T_TOL=Math.round(TH.npp_plan_tol*100);
const T_DT=TH.dt_month_pct*100, T_PL=TH.payload_tol*100;
const DRV=[['Geo','geo'],['On time','ontime'],['D&T','dt'],['Payload','payload'],['Created Date','created'],['User','username']];
/* 4 tiêu chí tính kết quả */
const DA=[
 {k:'payload',n:'Payload',v:s=>pc(s.payload_fail_pct),ok:s=>s.v_payload,th:'Chuyến quá tải < '+T_PL+'% số chuyến',
  sub:s=>`${fmt(s.payload_plans_fail)} / ${fmt(s.plans)} chuyến chở ≥ ${TH.payload_ratio} lần tải trọng`,bar:s=>[s.payload_fail_pct,T_PL]},
 {k:'dt',n:'Distance & Time',v:s=>pc(s.dt_route_fail_pct),ok:s=>s.v_dt,th:'Chuyến hỏng < '+T_DT+'% số chuyến',
  sub:s=>`${fmt(s.dt_routes_fail)} / ${fmt(s.plans)} chuyến hỏng · ${fmt(s.dt_orders_fail)} đơn lỗi`,bar:s=>[s.dt_route_fail_pct,T_DT]},
 {k:'created',n:'Created Date',v:s=>fmt(s.cd_routes_fail)+' chuyến',ok:s=>s.v_created,th:'0 chuyến lỗi',
  sub:s=>`${fmt(s.cd_fail)} đơn tạo sau khi giao`},
 {k:'username',n:'User name',v:s=>fmt(s.users_wrong)+' tài khoản',ok:s=>s.v_username,th:'0 tài khoản sai',
  sub:s=>`${fmt(s.users_total)} tài khoản giao hàng`}];
/* chỉ số theo dõi, không tính vào kết quả */
const TRK=[
 {k:'geo',n:'Geo Compliance',v:s=>pc(s.geo_pct),ok:s=>s.v_geo,th:'Tham chiếu ≥ '+TH.geo+'%',sub:s=>`${fmt(s.geo_fail)} / ${fmt(s.geo_scope)} đơn lỗi (không tính DSA)`},
 {k:'ontime',n:'On time',v:s=>pc(s.ot_pct),ok:s=>s.v_ontime,th:'Tham chiếu > '+TH.ontime+'%',sub:s=>`${fmt(s.ot_fail)} đơn trễ hạn · Successful dùng chung`},
 {k:'h24',n:'On time 24H',v:s=>pc(s.t24_pct),ok:s=>s.v_24,th:'Tham chiếu > '+TH.ontime+'%',sub:s=>`${fmt(s.t24_fail)} / ${fmt(s.t24_scope)} đơn lỗi · ${fmt(s.h24_fail)} quá 24H · ${fmt(s.wh_fail)} giao sau ${TH.wh_end}:00`},
 {k:'plan',n:'Chuyến lỗi > '+T_PLAN+'%',v:s=>pc(s.plan_fail_pct),ok:s=>s.v_plan,th:'Tham chiếu ≤ '+T_TOL+'% số chuyến',sub:s=>`${fmt(s.plan_fail)} / ${fmt(s.plans)} chuyến có trên ${T_PLAN}% đơn lỗi ở bất kỳ KPI nào`}];
const trkChip=v=>v==='PASS'?'<span class="chip ok">trong ngưỡng</span>':'<span class="chip no">dưới ngưỡng</span>';

function gaps(s){
  const g=[], m=s.margin;
  if(s.v_payload==='FAIL') g.push([-m.pl_margin,'chuyến',`Payload: cần giảm ${fmt(-m.pl_margin)} chuyến quá tải để về dưới ${T_PL}% (được phép tối đa ${fmt(m.pl_allow)} chuyến).`]);
  if(s.v_dt==='FAIL') g.push([-m.dt_margin,'chuyến',`Distance & Time: cần giảm ${fmt(-m.dt_margin)} chuyến hỏng để về dưới ${T_DT}% (được phép tối đa ${fmt(m.dt_allow)} chuyến).`]);
  if(s.v_created==='FAIL') g.push([s.cd_routes_fail,'chuyến',`Created Date: ${fmt(s.cd_routes_fail)} chuyến có đơn tạo sau khi giao (${fmt(s.cd_fail)} đơn). Không cho phép chuyến nào.`]);
  if(s.v_username==='FAIL') g.push([s.users_wrong,'tài khoản',`User name: đổi ${fmt(s.users_wrong)} tài khoản sai sang SĐT tài xế, biển số xe hoặc tài khoản DSA.`]);
  return g.sort((a,b)=>a[0]-b[0]);
}
function todoList(s){
  const g=gaps(s), m=s.margin;
  if(!g.length) return `<ul class="todo"><li class="okk"><span class="tn">✓</span><span>Đạt cả 4 tiêu chí. Còn được phép thêm <b>${fmt(m.dt_margin)} chuyến hỏng D&T</b> và <b>${fmt(m.pl_margin)} chuyến quá tải</b>.</span></li></ul>`;
  return `<ul class="todo">${g.map(x=>`<li><span class="tn">${fmt(x[0])}</span><span><b>${x[1]}</b> · ${esc(x[2])}</span></li>`).join('')}</ul>`;
}
function tile(c,s,all,track){
  const ok=c.ok(s)==='PASS';
  let bar='';
  if(c.bar){const [v,t]=c.bar(s);bar=`<div class="bar" aria-hidden="true"><b style="width:${Math.min(100,(v||0)/(t*3)*100)}%;background:${ok?'var(--good)':'var(--crit)'}"></b><i style="left:33.3%"></i></div>`;}
  const npass=all?DATA.scorecard.filter(x=>c.ok(x)==='PASS').length:null;
  return `<button type="button" class="kpi ${track?'':(ok?'ok':'no')}" data-kpi="${c.k}">
    <div class="kh"><span class="kn">${c.n}</span>${track?trkChip(c.ok(s)):chip(c.ok(s))}</div>
    <div class="kv">${c.v(s)}</div>${bar}
    <div class="kt">${esc(c.th)}${all?` · <b>${npass}/${NPPS.length}</b> NPP ${track?'trong ngưỡng':'đạt'}`:''}</div>
    <div class="kt">${esc(c.sub(s))}</div></button>`;
}

    h+=`<section class="card"><div class="verdict"><div class="vbig ${np?'pass':'fail'}">${np}<small>/${NPPS.length} NPP</small></div>
      <div class="vtext"><h2>đạt Data Accuracy tháng</h2>
      <p class="cap">Kỳ ${esc(DATA.meta.period)} · ${fmt(DATA.meta.orders)} đơn · ${fmt(DATA.meta.plans)} chuyến. Đạt khi qua cả 4 tiêu chí: Payload, Distance & Time, Created Date, User name. Geo, On time và On time 24H chỉ để theo dõi.</p>
      <div class="npps">${DATA.scorecard.map(x=>`<button type="button" class="npill" data-npp="${x.npp}"><i style="background:${x.overall==='PASS'?'var(--good)':'var(--crit)'}"></i>${x.npp}<span class="cap" style="margin:0;font-weight:400">${x.n_fail?'trượt '+x.n_fail:'đạt'}</span></button>`).join('')}</div></div></div></section>`;
  } else {
    const inf=DATA.npp_info[scope];
    h+=`<section class="card"><div class="verdict"><div class="vbig ${s.overall==='PASS'?'pass':'fail'}">${s.overall==='PASS'?'ĐẠT':'KHÔNG ĐẠT'}</div>
      <div class="vtext"><h2>NPP ${esc(scope)} · ${esc(inf.name)}</h2>
      <p class="cap">${esc(inf.area)} · ${esc(inf.region)} · ${fmt(s.orders)} đơn · ${fmt(s.plans)} chuyến · ${s.n_fail?`trượt <b>${s.n_fail}</b>/4 tiêu chí, mất 15% DIP`:'đạt cả 4 tiêu chí, nhận 15% DIP'}.</p></div></div></section>`;
  }
  h+=`<section class="card"><div><h2>Kết quả 4 tiêu chí Data Accuracy</h2><p class="cap">Phải đạt cả 4 mới tính là đạt tháng. Bấm một ô để xem chi tiết và danh sách lỗi.</p></div><div class="kpis">${DA.map(c=>tile(c,s,all,false)).join('')}</div></section>`;
  h+=`<section class="card"><div><h2>Theo dõi — không tính vào kết quả</h2><p class="cap">Các chỉ số này giúp NPP theo dõi chất lượng giao hàng. Ngưỡng ghi trên ô chỉ để tham chiếu.</p></div><div class="kpis">${TRK.map(c=>tile(c,s,all,true)).join('')}</div></section>`;
  if(all){
    const head=[['NPP'],['Payload','n'],['D&T','n'],['Created Date','n'],['User sai','n'],['Kết quả'],['Geo','n'],['On time','n'],['24H','n'],['Chuyến lỗi >'+T_PLAN+'%','n']];
    const cell=(ok,v,trk)=>`<td class="n ${trk?'':(ok==='PASS'?'cok':'cno')}">${v}</td>`;
    const rw=(x,tot)=>cell(tot?'':x.v_payload,pc(x.payload_fail_pct))+cell(tot?'':x.v_dt,pc(x.dt_route_fail_pct))+cell(tot?'':x.v_created,fmt(x.cd_routes_fail))+cell(tot?'':x.v_username,fmt(x.users_wrong));
    const trk=x=>`<td class="n">${pc(x.geo_pct,1)}</td><td class="n">${pc(x.ot_pct,1)}</td><td class="n">${pc(x.t24_pct,1)}</td><td class="n">${pc(x.plan_fail_pct,1)}</td>`;
    const rows=DATA.scorecard.map(x=>`<tr class="click" data-npp="${x.npp}"><th scope="row">${x.npp}</th>${rw(x)}<td>${chip(x.overall)}</td>${trk(x)}</tr>`);
    rows.push(`<tr><th scope="row">TỔNG</th>${rw(DATA.total,true).replace(/ c(ok|no)/g,'')}<td></td>${trk(DATA.total)}</tr>`);
    h+=`<section class="card"><div><h2>Bảng điểm theo nhà phân phối</h2><p class="cap">Payload và D&T ghi tỷ lệ chuyến lỗi; Created Date ghi số chuyến lỗi; User sai ghi số tài khoản sai. Ô đỏ là tiêu chí không đạt. Bốn cột cuối chỉ để theo dõi. Bấm một dòng để xem riêng NPP đó.</p></div>${table(head,rows,{cls:'matrix'})}</section>`;

      <div class="grid2" style="align-items:start">${fails.map(x=>`<div style="display:grid;gap:8px;align-content:start"><h3>${x.npp}</h3>${todoList(x)}</div>`).join('')}</div></section>`;
  } else {
    h+=`<section class="card"><div><h2>Việc cần làm — nhẹ nhất trước</h2><p class="cap">Còn thiếu đúng bao nhiêu chuyến hoặc tài khoản để đạt.</p></div>${todoList(s)}</section>`;
    const us=DATA.users.ALL.filter(u=>u.npp===scope).slice(0,15);

      table([['Tài khoản'],['Loại'],['Đơn','n'],['Đơn lỗi','n'],['D&T','n'],['Payload','n'],['Created','n'],['Geo','n'],['On time','n'],['24H','n']],
      us.map(u=>`<tr class="click" data-user="${esc(u.username)}"><td class="mono">${esc(u.username)}</td><td>${esc(u.utype)}</td><td class="n">${fmt(u.orders)}</td><td class="n">${fmt(u.err)}</td><td class="n">${fmt(u.dt)}</td><td class="n">${fmt(u.pl)}</td><td class="n">${fmt(u.cd)}</td><td class="n">${fmt(u.geo)}</td><td class="n">${fmt(u.ot)}</td><td class="n">${fmt(u.t24)}</td></tr>`))}</section>`;
  }
  return h;
}

/* ---------------- trang: Chi tiết KPI ---------------- */
function head(c,s,track,extra=''){
  const all=scope==='ALL';
  return `<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:start"><div><div class="eyebrow">${all?'Tất cả NPP':'NPP '+esc(scope)} · ${track?'theo dõi, không tính vào kết quả':'tiêu chí Data Accuracy'} · ${esc(c.th)}</div><h2>${c.n}: ${c.v(s)}</h2><p class="cap">${esc(c.sub(s))}${extra}</p></div>${track?trkChip(c.ok(s)):chip(c.ok(s))}</div>`;
}
const byNpp=(f,o={})=>hbar(DATA.scorecard.map(x=>({l:x.npp,v:f(x),bad:o.bad?o.bad(x):false})),o);
function pPlan(){
  const s=curS(), all=scope==='ALL', c=TRK.find(x=>x.k==='plan');
  let h=`<section class="card">${head(c,s,true)}
    ${all?byNpp(x=>x.plan_fail_pct,{thr:T_TOL,bad:x=>x.v_plan==='FAIL'})+'<p class="cap">Đường đứt là mức tham chiếu '+T_TOL+'%. Chỉ số này gộp lỗi của mọi KPI kể cả Geo và On time, nên không dùng để tính kết quả.</p>':''}</section>`;
  const dr=(all?DATA.scorecard:[s]).map(x=>`<tr><th scope="row">${x.npp}</th><td class="n">${fmt(x.plan_fail)}</td>${DRV.map(d=>`<td class="n">${fmt(x.plan_drivers[d[0]])}</td>`).join('')}</tr>`);
  h+=`<section class="card"><div><h2>Loại lỗi có trong chuyến lỗi</h2><p class="cap">Số chuyến lỗi có ít nhất một đơn mang loại lỗi đó. Một chuyến có thể chứa nhiều loại.</p></div>
    ${table([['NPP'],['Chuyến lỗi','n'],...DRV.map(d=>[d[0],'n'])],dr)}</section>`;
  const sz=s.plan_sizes;
  h+=`<section class="card"><div><h2>Tỷ lệ chuyến lỗi theo số đơn của chuyến</h2><p class="cap">Chuyến 1–3 đơn chỉ cần 1 đơn lỗi là vượt ${T_PLAN}%.</p></div>
    ${vbar(sz.map(x=>({l:x.label,v:x.plans?Math.round(x.fail/x.plans*1000)/10:0})),{fmtv:v=>n1(v)+'%'})}</section>`;
  const pls=rowsIn(DATA.plan_list), lim=200;
  h+=`<section class="card"><div><h2>Danh sách chuyến lỗi</h2><p class="cap">${fmt(pls.length)} chuyến${pls.length>lim?`, hiện ${lim} chuyến đầu`:''}. Bấm một chuyến để xem từng đơn lỗi.</p></div>
    ${table([['Chuyến'],['NPP'],['Ngày'],['Tài khoản'],['Đơn','n'],['Đơn lỗi','n'],['Tỷ lệ lỗi','n'],['Loại lỗi']],pls.slice(0,lim).map(r=>`<tr class="click" data-plan="${esc(r.plan)}"><td class="mono">${esc(r.plan)}</td><td>${esc(r.npp)}</td><td class="mono">${esc(r.date)}</td><td class="mono">${esc(r.user)}</td><td class="n">${fmt(r.orders)}</td><td class="n">${fmt(r.err)}</td><td class="n">${n1(r.ratio)}%</td><td>${esc(r.types)}</td></tr>`))}</section>`;
  return h;
}
function pKpi(){
  const s=curS(), all=scope==='ALL';
  if(!DA.concat(TRK).some(c=>c.k===kpiSel)) kpiSel='payload';
  const segBtn=(c,track)=>`<button type="button" data-ks="${c.k}" class="${c.k===kpiSel?'on':''}" aria-pressed="${c.k===kpiSel}">${track?'':`<i style="background:${c.ok(s)==='PASS'?'var(--good)':'var(--crit)'}"></i>`}${c.n}</button>`;
  let h=`<div style="display:grid;gap:8px"><div class="seg" role="tablist"><span class="eyebrow" style="align-self:center;min-width:9ch">Tính kết quả</span>${DA.map(c=>segBtn(c,false)).join('')}</div>
    <div class="seg" role="tablist"><span class="eyebrow" style="align-self:center;min-width:9ch">Theo dõi</span>${TRK.map(c=>segBtn(c,true)).join('')}</div></div>`;
  const k=kpiSel;
  if(k==='plan') return h+pPlan();
  const da=DA.find(c=>c.k===k), c=da||TRK.find(x=>x.k===k), track=!da;
  if(k==='payload'){
    h+=`<section class="card">${head(c,s,false)}${all?byNpp(x=>x.payload_fail_pct,{thr:T_PL,max:Math.max(T_PL*1.4,...DATA.scorecard.map(x=>x.payload_fail_pct)),bad:x=>x.v_payload==='FAIL'})+'<p class="cap">Đường đứt là dung sai '+T_PL+'%.</p>':''}</section>`;
    const rows=rowsIn(DATA.pl_top).map(r=>`<tr class="click" data-plan="${esc(r.plan)}"><td class="mono">${esc(r.plan)}</td><td>${esc(r.npp)}</td><td>${esc(r.date)}</td><td class="mono">${esc(r.truck)}</td><td class="n">${fmt(r.orders)}</td><td class="n">${n1(r.weight,2)} t</td><td class="n">${n1(r.cap,2)} t</td><td class="n cno">${n1(r.ratio,2)}×</td></tr>`);
    h+=`<section class="card"><div><h2>Chuyến chở từ ${TH.payload_ratio} lần tải trọng trở lên</h2><p class="cap">Tổng Assigned_Weight của chuyến chia cho TruckCapacityWeight. NPP vẫn đạt nếu số chuyến này dưới ${T_PL}% tổng chuyến, nhưng từng chuyến vẫn được ghi lỗi để theo dõi. Nên kiểm tra tải trọng xe khai trong TMS.</p></div>
      ${table([['Chuyến'],['NPP'],['Ngày'],['Xe'],['Đơn','n'],['Hàng','n'],['Tải trọng','n'],['Tỷ lệ','n']],rows)}</section>`;
  }
  if(k==='dt'){
    h+=`<section class="card">${head(c,s,false)}${all?byNpp(x=>x.dt_route_fail_pct,{thr:T_DT,max:Math.max(T_DT*1.4,...DATA.scorecard.map(x=>x.dt_route_fail_pct)),bad:x=>x.v_dt==='FAIL'})+'<p class="cap">Đường đứt là dung sai '+T_DT+'%.</p>':''}</section>`;
    const rows=rowsIn(DATA.dt_top).map(r=>`<tr class="click" data-plan="${esc(r.plan)}"><td class="mono">${esc(r.plan)}</td><td>${esc(r.npp)}</td><td>${esc(r.date)}</td><td class="mono">${esc(r.user)}</td><td class="n">${fmt(r.orders)}</td><td class="n">${fmt(r.bad)}</td><td class="n cno">${pc(r.bad/r.orders*100,0)}</td></tr>`);

      ${table([['Chuyến'],['NPP'],['Ngày'],['Tài khoản'],['Đơn','n'],['Đơn lỗi','n'],['Tỷ lệ lỗi','n']],rows)}</section>`;

const XCOLS=[['Date','Ngày'],['TenantName','NPP'],['PlanNumber','Chuyến'],['OrderNumber','Đơn'],['OutletCode','Outlet'],['username','Tài khoản'],['utype','Loại tài khoản'],['DriverName','Tài xế/Xe'],['Status','Trạng thái'],['Sent_To_distributor','Created Date (Fill Rate)'],['DeliverDateTime','Giao lúc'],['PromisedDate','Ngày hứa'],['distance_to_dropped','Lệch vị trí (m)'],['gap','Cách outlet trước (phút)'],['seq','Thứ tự trong chuyến'],['plan_orders','Số đơn của chuyến'],['plan_err','Số đơn lỗi của chuyến'],['plan_err_pct','% đơn lỗi của chuyến'],['plan_fail_txt','Chuyến lỗi >30% (theo dõi)'],['plan_ratio','Tỷ lệ tải chuyến'],['TruckCategory','Loại xe'],['TruckCapacityWeight','Tải trọng xe'],['Assigned_Weight','Khối lượng đơn'],['h24_dur','Thời gian tính SLA 24H (giờ)'],['loi','Loại lỗi'],['ly_do','Lý do']];
const xv=(r,k)=>k==='plan_err_pct'?Math.round(r.plan_err_ratio*1000)/10:k==='plan_fail_txt'?(r.plan_fail?'Có':'Không'):r[k];
async function saveFile(kind){
  const rows=filtered();
  const name=`TMS_don_loi_${scope==='ALL'?(EF.npp||'tat_ca'):scope}${EF.type?'_'+EF.type.replace(/\W+/g,''):''}${EF.day?'_'+EF.day.replace('/','-'):''}.${kind}`;
  let data;
  if(kind==='csv'){
    const q=v=>{const s=String(v??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
    data='﻿'+[XCOLS.map(c=>c[1]).join(','),...rows.map(r=>XCOLS.map(c=>q(xv(r,c[0]))).join(','))].join('\n');
  } else {
    if(!window.XLSX){toast('Chưa tải được thư viện Excel. Hãy dùng Tải CSV.');return;}
    const ws=XLSX.utils.aoa_to_sheet([XCOLS.map(c=>c[1]),...rows.map(r=>XCOLS.map(c=>xv(r,c[0])??''))]);
    ws['!cols']=XCOLS.map(c=>({wch:Math.max(10,c[1].length+2)}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Don loi');
    data=new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'}));
  }
  const dl=window.claude&&window.claude.use&&await window.claude.use('downloads');
  if(!dl){const blob=data instanceof Uint8Array?new Blob([data],{type:'application/octet-stream'}):new Blob([data],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast('Đã tải '+fmt(rows.length)+' dòng');return;}
  try{await dl.save({filename:name,data});toast('Đã tải '+fmt(rows.length)+' dòng');}
  catch(e){if(e&&e.code!=='declined') toast('Không tải được file ('+(e.code||'lỗi')+').');}
}

   ['On time 24H',`Đồng hồ tính từ thời điểm tạo đơn (<code>Sent_To_distributor</code>) tới <code>DeliverDateTime</code>, phải trong ${TH.sla_hours} giờ. Đơn tạo từ ${TH.send_cutoff}:00 và giao sau ngày tạo: đồng hồ bắt đầu 00:00 hôm sau; tạo thứ 7 từ ${TH.send_cutoff}:00 thì bắt đầu 00:00 thứ 2. Chủ nhật là ngày nghỉ, thời gian rơi vào Chủ nhật được trừ, trừ khi đơn được giao vào Chủ nhật. Giao sau ${TH.wh_end}:00:00 cũng là lỗi. Đơn tạo sau khi giao tính là lỗi; đơn thiếu giờ tạo hoặc giờ giao không xét. Mức tham chiếu > ${TH.ontime}%.`],
   ['Chuyến lỗi > '+T_PLAN+'%',`Đơn lỗi ở bất kỳ KPI nào (kể cả Geo, On time); chuyến lỗi khi trên ${T_PLAN}% đơn lỗi. Mức tham chiếu ≤ ${T_TOL}% số chuyến. Giúp NPP thấy chuyến nào cần rà trước.`]];
  let h=`<section class="card"><div><h2>Cách chấm điểm</h2><p class="cap">Theo file chấm Data Accuracy chính thức. NPP đạt tháng khi qua <b>cả 4 tiêu chí</b>; trượt một tiêu chí là mất trọn 15% DIP (10% Data Accuracy + 5% TMS). Dữ liệu tính trên toàn bộ đơn trong file TMS của tháng.</p></div>
    <div class="gate">${R.map(r=>`<div>${r[0]}<span>${r[1]}</span></div>`).join('')}</div></section>`;
  h+=`<section class="card"><h2>4 tiêu chí tính kết quả</h2><div class="rules">${R.map(r=>`<article class="rule"><div class="rh"><h3>${r[0]}</h3><span class="rt">${r[1]}</span></div><p><span class="eyebrow">Đếm theo</span> ${r[2]}</p><p>${r[3]}</p></article>`).join('')}</div></section>`;
  h+=`<section class="card"><div><h2>Chỉ số theo dõi</h2><p class="cap">Hiển thị để NPP theo dõi và cải thiện, không ảnh hưởng kết quả tháng.</p></div><div class="rules">${T.map(r=>`<article class="rule"><h3>${r[0]}</h3><p>${r[1]}</p></article>`).join('')}</div></section>`;
  h+=`<section class="card"><h2>Đọc báo cáo</h2><div class="rules">
    <article class="rule"><h3>Được phép</h3><p>Số chuyến lỗi tối đa vẫn đạt = số lớn nhất còn dưới ${T_DT}% tổng chuyến. NPP 400 chuyến được phép tối đa 19 chuyến hỏng D&T và 19 chuyến quá tải.</p></article>
    <article class="rule"><h3>Khoảng cách giữa hai outlet</h3><p>File TMS không có sẵn cột khoảng cách, nên báo cáo tính từ toạ độ <code>lat_to/long_to</code> của hai outlet liên tiếp trong chuyến.</p></article>
    <article class="rule"><h3>Nếu thấy số liệu chưa đúng</h3><p>Vào tab Đơn hàng có lỗi, lọc theo loại lỗi hoặc ngày, tải Excel, đánh dấu đơn nghi bị tính oan kèm lý do và gửi quản lý vùng phụ trách NPP.</p></article></div></section>`;
  return h;
}

/* ---------------- trang: Chất lượng dữ liệu (admin) ---------------- */
function pDq(){
  const q=DATA.dq;
  let h=`<section class="card"><div><h2>Ghép hai file</h2><p class="cap">TMS_Order_Detail (OrderNumber) ghép với Fill_Rate (DocNo) để lấy Created Date = Sent_To_distributor.</p></div>
  <div class="dl">
    <div><b>${fmt(q.rows_tms)}</b><span>dòng TMS · ${fmt(q.dup_orders)} đơn trùng</span></div>
    <div><b>${fmt(q.rows_fr)}</b><span>dòng Fill Rate</span></div>
    <div><b>${fmt(q.matched)}</b><span>đơn ghép được (${pc(q.matched/q.rows_tms*100)})</span></div>
    <div><b>${fmt(q.tms_unmatched)}</b><span>đơn TMS không có trong Fill Rate</span></div>
    <div><b>${fmt(q.fr_unmatched)}</b><span>đơn Fill Rate không có trong TMS</span></div>
  </div>
  ${table([['NPP'],['Đơn TMS không ghép được'],['Trạng thái']],q.tms_unmatched_rows.map(r=>`<tr><td>${esc(r.npp)}</td><td class="mono">${esc(r.order)}</td><td>${esc(r.status)}</td></tr>`))}
  <p class="cap">Đơn Fill Rate không có trong TMS: <span class="mono">${q.fr_unmatched_list.map(esc).join(', ')||'—'}</span>.</p></section>`;
  h+=`<section class="card"><h2>Phát hiện trong dữ liệu</h2><div class="dl">
    <div><b>${fmt(q.null_deliver)}</b><span>đơn thiếu DeliverDateTime</span></div>
    <div><b>${fmt(q.deliver_after_period)}</b><span>đơn giao sau 30/09 (ngày kế hoạch trong tháng 9)</span></div>
    <div><b>${fmt(q.deliver_before_period)}</b><span>đơn ghi giao trước 01/09</span></div>
    <div><b>${fmt(q.geo_out5k)}</b><span>đơn lệch vị trí trên 5km · xa nhất ${fmt(Math.round(q.geo_max/1000))}km</span></div>
    <div><b>${pc(q.gap_match)}</b><span>khoảng cách thời gian tự tính khớp cột time_outlet_outlet (±1 phút)</span></div>
    <div><b>${fmt(q.plans_mixed_cap)}</b><span>chuyến có nhiều mức tải trọng xe</span></div>
    <div><b>${fmt(q.cd_neg)}</b><span>đơn tạo sau khi giao · ${fmt(q.cd_neg_gt24)} đơn chênh trên 1 ngày</span></div>
    ${Object.entries(q.status).map(([k,v])=>`<div><b>${fmt(v)}</b><span>trạng thái ${esc(k)}</span></div>`).join('')}
  </div></section>`;
  const sens=DATA.sens;
  h+=`<section class="card"><div><h2>Kết quả thay đổi thế nào theo cách chốt</h2><p class="cap">Các điểm chưa có văn bản chốt. Ô được tô là NPP đổi kết quả so với cách đang áp dụng.</p></div>
    ${table([['Kịch bản'],['Số NPP đạt','n'],...NPPS.map(n=>[n])],sens.map(s=>`<tr><th scope="row">${esc(s.label)}</th><td class="n">${s.pass}/${NPPS.length}</td>${NPPS.map(n=>{const ch=s.v[n]!==sens[0].v[n];return `<td style="${ch?'background:var(--warn-soft)':''}" class="${s.v[n]==='PASS'?'cok':''}">${s.v[n]==='PASS'?'Đạt':'Trượt'}</td>`;}).join('')}</tr>`))}</section>`;
  return h;
}

/* ---------------- điều hướng ---------------- */
const PAGES=[['overview','Tổng quan',pOverview],['kpi','Chi tiết KPI',pKpi],['trend','Xu hướng theo ngày',pTrend],['errors','Đơn hàng có lỗi',pErrors],['logic','Cách chấm điểm',pLogic],['dq','Chất lượng dữ liệu',pDq]];
function buildTabs(){
  $('#tabs').innerHTML=PAGES.filter(p=>p[0]!=='dq'||isAdmin()).map(p=>`<button type="button" role="tab" data-p="${p[0]}" aria-selected="${p[0]===page}" class="${p[0]===page?'on':''}">${p[1]}</button>`).join('');
}
function render(){
  buildTabs();
  const inf=scope==='ALL'?null:DATA.npp_info[scope];
  $('#hmeta').textContent=`${DATA.meta.bu} · ${scope==='ALL'?DATA.meta.regions.join(', ')+' · '+NPPS.length+' NPP':inf.area+' · NPP '+scope} · Kỳ ${DATA.meta.period}`;
  $('#main').innerHTML=PAGES.find(p=>p[0]===page)[2]();
  try{ if(location.hash!=='#'+page) history.replaceState(null,'','#'+page);}catch(_){}
  wire();
}
function go(p){page=p;render();window.scrollTo({top:0});}
function setScope(n){if(!isAdmin())return;scope=n;$('#scope').value=n;EF.npp='';epage=1;render();}
function wire(){
  document.querySelectorAll('[data-npp]').forEach(el=>el.addEventListener('click',()=>setScope(el.dataset.npp)));
  document.querySelectorAll('.kpi[data-kpi]').forEach(el=>el.addEventListener('click',()=>{kpiSel=el.dataset.kpi;go('kpi');}));
  document.querySelectorAll('[data-ks]').forEach(el=>el.addEventListener('click',()=>{kpiSel=el.dataset.ks;render();}));
  document.querySelectorAll('[data-plan]').forEach(el=>el.addEventListener('click',()=>{EF={q:el.dataset.plan,type:'',day:'',npp:'',pf:false};epage=1;go('errors');}));
  document.querySelectorAll('[data-user]').forEach(el=>el.addEventListener('click',()=>{EF={q:el.dataset.user,type:'',day:'',npp:'',pf:false};epage=1;go('errors');}));
  document.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click',()=>{EF={q:'',type:'',day:el.dataset.day,npp:'',pf:false};epage=1;go('errors');}));
  if(page==='errors'){
    let tmr;
    $('#fq').addEventListener('input',e=>{clearTimeout(tmr);tmr=setTimeout(()=>{EF.q=e.target.value;epage=1;render();const f=$('#fq');f.focus();f.setSelectionRange(f.value.length,f.value.length);},300);});
    $('#ft').addEventListener('change',e=>{EF.type=e.target.value;epage=1;render();});
    $('#fd').addEventListener('change',e=>{EF.day=e.target.value;epage=1;render();});
    $('#fpf').addEventListener('change',e=>{EF.pf=e.target.checked;epage=1;render();});
    if($('#fn')) $('#fn').addEventListener('change',e=>{EF.npp=e.target.value;epage=1;render();});
    $('#fclear').addEventListener('click',()=>{EF={q:'',type:'',day:'',npp:'',pf:false};epage=1;render();});
    $('#pprev').addEventListener('click',()=>{epage--;render();});
    $('#pnext').addEventListener('click',()=>{epage++;render();});
    $('#xlsx').addEventListener('click',()=>saveFile('xlsx'));
    $('#csv').addEventListener('click',()=>saveFile('csv'));
  }
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b) go(b.dataset.p);});
$('#scope').addEventListener('change',e=>setScope(e.target.value));
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600);}
$('#theme').addEventListener('click',()=>{const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme!=='dark':!matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'dark':'light';$('#theme').setAttribute('aria-pressed',dark);});

/* ---------------- vào ứng dụng sau khi giải mã ---------------- */
$('#foot').innerHTML=`Nguồn: ${esc(DATA.meta.src)} · Kỳ ${esc(DATA.meta.period)} · Dựng lúc ${esc(DATA.meta.built)}. Dữ liệu tự cập nhật khi có file mới trong thư mục input/ của repo.`;
role=LOGIN_ROLE;scope=role==='admin'?'ALL':role;
$('#who').textContent=role==='admin'?'Admin · phạm vi':'NPP '+role;
const sel=$('#scope');sel.hidden=role!=='admin';
if(role==='admin') sel.innerHTML=`<option value="ALL">Tất cả NPP</option>`+NPPS.map(n=>`<option value="${n}">NPP ${n}</option>`).join('');
$('#login').hidden=true;$('#app').hidden=false;
const want=(location.hash||'').slice(1);
page=PAGES.some(p=>p[0]===want)&&(want!=='dq'||role==='admin')?want:'overview';
render();
/* đăng xuất: tải lại trang để xoá dữ liệu đã giải mã khỏi bộ nhớ */
$('#logout').addEventListener('click',()=>{try{history.replaceState(null,'',location.pathname);}catch(_){}location.reload();});
}
</script>
